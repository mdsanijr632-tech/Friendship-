name: Build & Release Debug APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-release:
    name: Build & Release Debug APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'

      - name: Build Debug APK
        run: gradle :app:assembleDebug --stacktrace --no-daemon

      - name: Upload Debug APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 30

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/heads/main') || github.event_name == 'workflow_dispatch'
        with:
          tag_name: debug-apk-build-${{ github.run_number }}-${{ github.run_attempt }}
          name: "Debug APK Build #${{ github.run_number }}"
          body: |
            ### 📱 Debug APK Build #${{ github.run_number }}

            - **Commit**: ${{ github.sha }}
            - **Branch**: ${{ github.ref_name }}
            - **Trigger**: ${{ github.event_name }}

            Download the attached APK below to install on your Android device.
          files: app/build/outputs/apk/debug/*.apk
          make_latest: true
          token: ${{ github.token }}
